<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSSE CAFE メニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-yellow-400">
    <header class="bg-white shadow px-6 py-4">
      <h1 class="text-2xl font-bold text-gray-900">POSSE CAFE</h1>
      <p class="text-gray-600 text-sm mt-1">東京・渋谷のスペシャルティコーヒーショップ</p>
    </header>

  <main class="max-w-2xl mx-auto px-4 py-8">
   <section class="mb-8">
        <h2 class="text-xl font-bold text-white mb-4">ドリンク</h2>

      <div class="bg-white rounded-lg shadow p-6 mb-4">
          <h3 class="text-lg font-bold text-gray-900">ブレンドコーヒー</h3>
          <p class="text-gray-600 mt-1">勉強や仕事で集中したいときのお供にどうぞ</p>
          <a href="#" class="text-blue-600 underline hover:text-blue-800">詳細を見る </a>
          <p class="text-blue-600 font-bold mt-2">280円</p>
          <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">注文する</button>
      </div>

        <div class="bg-white rounded-lg shadow p-6 mb-4">
          <h3 class="text-lg font-bold text-gray-900">レモネード</h3>
          <p class="text-gray-600 mt-1">レモンの清涼感とはちみつのコク深い甘みで、疲れた心と体をリセット。</p>
          <a href="#" class="text-blue-600 underline hover:text-blue-800">詳細を見る</a>
          <p class="text-blue-600 font-bold mt-2">280円</p>
          <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">注文する</button>
        </div>
   </section>

      
        <h2 class="text-xl font-bold text-white mb-4">フード</h2>

        <div class="bg-white rounded-lg shadow p-6 mb-4">
          <h3 class="text-lg font-bold text-gray-900">チーズトースト</h3>
          <p class="text-gray-600 mt-1">外はサクサク、中はふんわり食感の厚切りトーストに絶品チーズをのせました。</p>
          <a href="#" class="text-blue-600 underline hover:text-blue-800">詳細を見る</a>
          <p class="text-blue-600 font-bold mt-2">250円</p>
          <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">注文する</button>
        </div>
        <div class="bg-white rounded-lg shadow p-6 mb-4">
          <h3 class="text-lg font-bold text-gray-900">大豆のホッドサンド</h3>
          <p class="text-gray-600 mt-1">大豆とトマトとチーズをたっぷり使った健康ホッドサンド</p>
          <a href="#" class="text-blue-600 underline hover:text-blue-800">詳細を見る</a>
          <p class="text-blue-600 font-bold mt-2">300円</p>
          <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">注文する</button>
        </div>

    </main>

    <footer class="bg-gray-100 text-center py-6 text-gray-500 text-sm">
      <p>2026 POSSE CAFE</p>
    </footer>
  </body>
</html>
