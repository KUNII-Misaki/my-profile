<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">

    <title>商品一覧</title>

        <h2 class="font-bold">傘</h2>

      <div class="bg-white rounded-lg shadow p-4 hover:bg-blue-100 hover:shadow-lg hover:scale-105">

        <h2 class="font-bold">手袋</h2>
        <p class="text-gray-500 text-sm mt-1">¥1,500</p>
      </div>

        <div class="text-4xl mb-2">📚</div>
        <h2 class="font-bold">本</h2>
        <p class="text-gray-500 text-sm mt-1">¥600</p>
      </div>

        <h2 class="font-bold">サングラス</h2>

        <h2 class="font-bold">お弁当</h2>

      <div class="bg-white rounded-lg shadow p-4 hover:bg-blue-100 hover:shadow-lg hover:scale-105">
        <div class="text-4xl mb-2">🍉</div>
        <h2 class="font-bold">スイカ</h2>
        <p class="text-gray-500 text-sm mt-1">￥600</p>

      <div class="bg-white rounded-lg shadow p-4 hover:bg-blue-100 hover:shadow-lg hover:scale-105">
        <div class="text-4xl mb-2">🍡</div>
        <h2 class="font-bold">だんご</h2>
        <p class="text-gray-500 text-sm mt-1">￥350</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4 hover:bg-blue-100 hover:shadow-lg hover:scale-105">
      <div class="text-4xl mb-2">🍰</div>
        <h2 class="font-bold">ケーキ</h2>
        <p class="text-gray-500 text-sm mt-1">￥1,000</p>

</html>
